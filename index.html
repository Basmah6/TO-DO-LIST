<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملاحظاتي • Notes</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
<style>
:root {
  --bg: #f4f6f8;
  --card-bg: #ffffff;
  --text: #1f2937;
  --accent: #3b82f6;
  --border: #e5e7eb;
  --toolbar-bg: #f8fafc;
}
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); transition:background .3s,color .3s; }
.container { max-width:1100px; margin:0 auto; padding:20px; }
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:15px; }
.greeting h1 { margin:0; font-size:28px; font-weight:700; }
.datetime { font-size:14px; color:#64748b; margin-top:4px; }
.switcher-group { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.theme-switcher { display:flex; gap:8px; }
.theme-dot { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid #fff; box-shadow:0 0 0 1px #cbd5e1; transition:transform .2s; }
.theme-dot:hover { transform:scale(1.1); }
.user-selector { display:flex; gap:8px; }
.user-btn { padding:6px 14px; border-radius:9999px; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:2px solid transparent; background:#f1f5f9; color:#334155; }
.user-btn.active { border-color:var(--accent); background:white; box-shadow:0 2px 6px rgba(0,0,0,.1); }
.notes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
.note-card { background:var(--card-bg); border-radius:16px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.06); cursor:pointer; transition:all .2s; border-left:6px solid var(--accent); position:relative; }
.note-card.pinned::before { content:"📌"; position:absolute; top:12px; left:12px; font-size:18px; }
.note-card:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.1); }
.note-card h3 { margin:0 0 10px 0; font-size:18px; font-weight:600; padding-left:28px; }
.preview { color:#64748b; font-size:14px; line-height:1.5; margin:0 0 12px 0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card-footer { display:flex; justify-content:space-between; font-size:12px; color:#94a3b8; }
.card-user { font-weight:bold; color:var(--accent); }
#editor-screen { max-width:900px; margin:0 auto; }
.editor-header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
#note-title { flex:1; font-size:24px; font-weight:700; border:none; background:transparent; outline:none; color:var(--text); padding:8px 0; }
.toolbar { display:flex; flex-wrap:wrap; gap:6px; background:var(--toolbar-bg); padding:10px; border-radius:12px; margin-bottom:12px; border:1px solid var(--border); align-items:center; }
.toolbar button { background:white; border:1px solid var(--border); padding:8px 12px; border-radius:8px; cursor:pointer; font-size:15px; transition:all .2s; }
.toolbar button:hover { background:#f1f5f9; border-color:var(--accent); }
.toolbar button.active { background:#e0f2fe; border-color:#3b82f6; }
.editor-content { background:var(--card-bg); min-height:60vh; padding:25px; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,.06); font-size:17px; line-height:1.75; outline:none; border:1px solid var(--border); text-align: right; }
.btn { padding:10px 20px; border-radius:10px; border:none; cursor:pointer; font-weight:600; transition:all .2s; }
.btn-primary { background:var(--accent); color:white; }
.empty-state { text-align:center; padding:60px 20px; color:#64748b; }
.editor-content ul, .editor-content ol { padding-right: 25px; margin: 8px 0; }
.action-buttons { display:flex; gap:8px; margin-right:auto; }
</style>
</head>
<body>
<div class="container">

  <div id="home-screen">
    <header>
      <div class="greeting">
        <h1 id="greeting-text"></h1>
        <div class="datetime" id="datetime"></div>
      </div>

      <div style="display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
        <div class="switcher-group">
          <div class="user-selector">
            <div class="user-btn" id="user-nawaf" onclick="selectUser('nawaf')">نواف 🧑🏻‍🏫</div>
            <div class="user-btn" id="user-basma" onclick="selectUser('basma')">بسمة 👩🏻‍💻</div>
          </div>
          <div class="theme-switcher">
            <div class="theme-dot" style="background:#f8fafc;border-color:#cbd5e1" onclick="applyTheme('light')" title="أبيض"></div>
            <div class="theme-dot" style="background:#bae6fd" onclick="applyTheme('blue')" title="أزرق"></div>
            <div class="theme-dot" style="background:#1e2937" onclick="applyTheme('dark')" title="أسود"></div>
            <div class="theme-dot" style="background:#fce7f3" onclick="applyTheme('pink')" title="وردي"></div>
          </div>
        </div>
        <button onclick="showTrash()" style="padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);cursor:pointer;font-weight:600;">🗑️ سلة المهملات</button>
        <button onclick="showNewNoteModal()" class="btn btn-primary">+ ملاحظة جديدة</button>
      </div>
    </header>

    <div id="notes-grid" class="notes-grid"></div>
  </div>

  <div id="editor-screen" style="display:none;">
    <div class="editor-header">
      <button onclick="goBack()" style="background:none;border:none;font-size:28px;cursor:pointer;padding:5px 12px;">←</button>
      <input type="text" id="note-title" placeholder="عنوان الملاحظة" style="flex:1;">
    </div>

    <div class="toolbar">
      <button onclick="formatText('formatBlock','h1')">H1</button>
      <button onclick="formatText('formatBlock','h2')">H2</button>
      <button onclick="formatText('bold')"><strong>B</strong></button>
      <button onclick="formatText('italic')"><em>I</em></button>
     <button onmousedown="event.preventDefault(); toggleHighlight('#86efac')" id="hl-green" style="background:#86efac;color:#166534;font-size:18px;">✏️</button>
<button onmousedown="event.preventDefault(); toggleHighlight('#fda4af')" id="hl-red" style="background:#fda4af;color:#9f1239;font-size:18px;">✏️</button>
<button onmousedown="event.preventDefault(); toggleHighlight('#fde047')" id="hl-yellow" style="background:#fde047;color:#854d0e;font-size:18px;">✏️</button>
      
      <div class="action-buttons">
        <button onclick="togglePin()" id="pin-btn" style="background:none;border:1px solid var(--border);font-size:18px;cursor:pointer;padding:6px 12px;border-radius:8px;">📌 تثبيت</button>
        <button onclick="deleteCurrentNote()" style="background:#fee2e2;color:#b91c1c;border:1px solid #fee2e2;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;">حذف 🗑️</button>
      </div>
    </div>

    <div id="note-content" class="editor-content" contenteditable="true"></div>
  </div>
</div>

<div id="trash-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;" onclick="if(event.target.id==='trash-modal') this.style.display='none'">
  <div style="background:var(--card-bg);padding:30px;border-radius:16px;width:90%;max-width:450px;max-height:70vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.2);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;">🗑️ سلة المهملات</h3>
      <button onclick="document.getElementById('trash-modal').style.display='none'" style="background:none;border:none;font-size:22px;cursor:pointer;">✕</button>
    </div>
    <div id="trash-list"></div>
  </div>
</div>

<div id="new-note-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:white;padding:30px;border-radius:16px;width:90%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.2);">
    <h3 style="margin-top:0;">ملاحظة جديدة</h3>
    <input type="text" id="new-title-input" placeholder="أدخل عنوان الملاحظة" style="width:100%;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:10px;margin:15px 0;">
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="hideNewNoteModal()" style="padding:10px 20px;border-radius:8px;border:1px solid #ddd;background:white;cursor:pointer;">إلغاء</button>
      <button onclick="confirmNewNote()" class="btn btn-primary">إنشاء</button>
    </div>
  </div>
</div>

<div id="confirm-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;">
  <div style="background:white;padding:32px;border-radius:20px;width:90%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;">
    <div style="font-size:48px;margin-bottom:12px;">🗑️</div>
    <h3 style="margin:0 0 12px;color:#1f2937;font-size:20px;">هل أنت متأكد؟</h3>
    <p style="color:#64748b;margin:0 0 24px;line-height:1.7;">سيتم نقل الملاحظة إلى سلة المهملات.</p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button onclick="closeConfirmModal()" style="padding:10px 24px;border-radius:10px;border:1px solid #e5e7eb;background:white;cursor:pointer;font-size:15px;font-weight:600;">إلغاء</button>
      <button onclick="confirmAction()" style="padding:10px 24px;border-radius:10px;border:none;background:#3b82f6;color:white;cursor:pointer;font-size:15px;font-weight:600;">تأكيد</button>
    </div>
  </div>
</div>

<div id="delete-forever-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;">
  <div style="background:white;padding:32px;border-radius:20px;width:90%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;">
    <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
    <h3 style="margin:0 0 12px;color:#b91c1c;font-size:20px;">حذف نهائي</h3>
    <p style="color:#64748b;margin:0 0 24px;line-height:1.7;">هل أنت متأكد أنك ستحذف الملاحظة للأبد؟<br>لا يمكن استرجاعها بعد ذلك.</p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button onclick="closeDeleteForeverModal()" style="padding:10px 24px;border-radius:10px;border:1px solid #e5e7eb;background:white;cursor:pointer;font-size:15px;font-weight:600;">إلغاء</button>
      <button onclick="deleteForever()" style="padding:10px 24px;border-radius:10px;border:none;background:#b91c1c;color:white;cursor:pointer;font-size:15px;font-weight:600;">حذف نهائي</button>
    </div>
  </div>
</div>

<script>
const { Client, Databases } = Appwrite;
const client = new Client();
client
    .setEndpoint('https://cloud.appwrite.io/v1')
    .setProject('6a5091df001eac425602'); 

const databases = new Databases(client);
const DATABASE_ID = '6a5093690027ac5f6daa';      
const NOTES_COLLECTION_ID = 'notes'; 
const TRASH_COLLECTION_ID = 'trash'; 

let notes = [], trash = [], currentNoteId = null, saveTimeout = null, currentUser = 'nawaf', currentHighlight = null;
const noteColorPalette = ['#f87171','#60a5fa','#34d399','#fbbf24','#a78bfa','#f472b6'];
let noteColorIndex = 0;

async function loadData() {
  try {
    const resNotes = await databases.listDocuments(DATABASE_ID, NOTES_COLLECTION_ID);
    notes = resNotes.documents.map(doc => ({ id: doc.$id, ...doc }));
    
    const resTrash = await databases.listDocuments(DATABASE_ID, TRASH_COLLECTION_ID);
    trash = resTrash.documents.map(doc => ({ id: doc.$id, ...doc }));

    const u = localStorage.getItem('currentUser'); if (u) currentUser = u;
    const t = localStorage.getItem('theme') || 'light'; applyTheme(t);
    
    renderNotes();
    updateUserUI();
  } catch (error) {
    console.error("خطأ أثناء تحميل البيانات من Appwrite:", error);
  }
}

function saveCurrentNote() {
  if (!currentNoteId) return;
  const note = notes.find(n => n.id === currentNoteId);
  if (!note) return;

  note.title = document.getElementById('note-title').value.trim() || 'ملاحظة بدون عنوان';
  note.content = document.getElementById('note-content').innerHTML;
  note.lastModified = Date.now();
  note.user = currentUser;

  databases.updateDocument(DATABASE_ID, NOTES_COLLECTION_ID, currentNoteId, {
    title: note.title,
    content: note.content,
    lastModified: note.lastModified,
    user: note.user
  }).catch(err => console.error("فشل المزامنة الفورية:", err));
}

function setupRealtimeListener() {
  client.subscribe(`databases.${DATABASE_ID}.collections.${NOTES_COLLECTION_ID}.documents`, response => {
    loadData();
  });
  client.subscribe(`databases.${DATABASE_ID}.collections.${TRASH_COLLECTION_ID}.documents`, response => {
    loadData();
  });
}

function formatDate(ts) { return new Date(ts).toLocaleDateString('ar-EG',{month:'short',day:'numeric',year:'numeric'}); }
function getPreview(html) {
  if (!html) return "لا يوجد محتوى بعد...";
  const d=document.createElement('div'); d.innerHTML=html; const t=d.textContent.trim();
  return t ? (t.length>110 ? t.substring(0,110)+'...' : t) : "لا يوجد محتوى بعد...";
}

function renderNotes() {
  const g = document.getElementById('notes-grid');
  g.innerHTML = notes.length===0 ? `<div class="empty-state" style="grid-column:1/-1"><p>لا توجد ملاحظات بعد</p><button onclick="showNewNoteModal()" class="btn btn-primary" style="margin-top:10px">أنشئ أول ملاحظة</button></div>` : '';
  
  [...notes].sort((a,b)=> (b.pinned?1:0) - (a.pinned?1:0) || b.lastModified - a.lastModified)
    .forEach(n=>{
      const c=document.createElement('div'); 
      c.className='note-card' + (n.pinned ? ' pinned' : '');
      if(n.color) c.style.borderLeftColor=n.color;
      
      const userEmoji = n.user === 'basma' ? '👩🏻‍💻 بسمة' : '🧑🏻‍🏫 نواف';
      
      c.innerHTML=`<h3>${n.title||'ملاحظة بدون عنوان'}</h3>
                   <p class="preview">${getPreview(n.content)}</p>
                   <div class="card-footer">
                     <span>${formatDate(n.lastModified)}</span>
                     <span class="card-user">${userEmoji}</span>
                   </div>`;
      c.onclick=()=>openNote(n.id); g.appendChild(c);
    });
}

function showNewNoteModal(){document.getElementById('new-note-modal').style.display='flex';setTimeout(()=>document.getElementById('new-title-input').focus(),100);}
function hideNewNoteModal(){document.getElementById('new-note-modal').style.display='none';document.getElementById('new-title-input').value='';}

async function confirmNewNote(){
  const title=document.getElementById('new-title-input').value.trim()||'ملاحظة جديدة';
  const color = noteColorPalette[noteColorIndex % noteColorPalette.length];
  noteColorIndex++;
  
  const id = Date.now().toString(36);
  const noteData = { title, content:'', lastModified:Date.now(), color, pinned:false, user:currentUser };

  try {
    const doc = await databases.createDocument(DATABASE_ID, NOTES_COLLECTION_ID, id, noteData);
    hideNewNoteModal(); 
    openNote(doc.$id);
    loadData();
  } catch (error) {
    console.error("فشل إنشاء ملاحظة بالسحابة:", error);
  }
}

function openNote(id){
  currentNoteId=id;
  const note=notes.find(n=>n.id===id);
  if(!note) return;
  document.getElementById('home-screen').style.display='none';
  document.getElementById('editor-screen').style.display='block';
  document.getElementById('note-title').value=note.title||'';
  document.getElementById('note-content').innerHTML=note.content||'';
  updatePinButton();
  currentHighlight = null;
  resetHighlighterButtons();
  
  // تفعيل القلم التلقائي فور فتح الملاحظة بناءً على المستخدم المختار
  applyUserColorDirectly();
  setTimeout(()=>{ document.getElementById('note-content').focus(); },80);
}

function goBack(){
  saveCurrentNote();
  document.getElementById('editor-screen').style.display='none';
  document.getElementById('home-screen').style.display='block';
  renderNotes();
}

function deleteCurrentNote(){
  if(!currentNoteId) return;
  openConfirmModal(async ()=>{
    const note = notes.find(n=>n.id===currentNoteId);
    if(note){ 
      try {
        await databases.createDocument(DATABASE_ID, TRASH_COLLECTION_ID, note.id, {
          title: note.title, content: note.content, lastModified: Date.now(), color: note.color, pinned: false, user: currentUser
        });
        await databases.deleteDocument(DATABASE_ID, NOTES_COLLECTION_ID, currentNoteId);
        document.getElementById('editor-screen').style.display='none';
        document.getElementById('home-screen').style.display='block';
        loadData();
      } catch (err) {
        console.error("فشل الحذف لسلة السحابة:", err);
      }
    }
  });
}

function showTrash(){
  const modal = document.getElementById('trash-modal');
  const list = document.getElementById('trash-list');
  list.innerHTML = trash.length === 0 ? '<p style="color:#94a3b8;text-align:center;">سلة المهملات فارغة</p>' :
    trash.map((n,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;">
      <span style="font-weight:600;">${n.title||'ملاحظة بدون عنوان'}</span>
      <div style="display:flex;gap:6px;">
        <button onclick="restoreNote('${n.id}', ${i})" style="padding:6px 12px;border-radius:6px;border:none;background:var(--accent);color:white;cursor:pointer;">استرجاع</button>
        <button onclick="openDeleteForeverModal(${i})" style="padding:6px 12px;border-radius:6px;border:none;background:#fee2e2;color:#b91c1c;cursor:pointer;">حذف نهائي</button>
      </div>
    </div>`).join('');
  modal.style.display='flex';
}

async function restoreNote(id, i){
  const note = trash.find(n => n.id === id);
  if(!note) return;
  try {
    await databases.createDocument(DATABASE_ID, NOTES_COLLECTION_ID, note.id, {
      title: note.title, content: note.content, lastModified: Date.now(), color: note.color, pinned: false, user: currentUser
    });
    await databases.deleteDocument(DATABASE_ID, TRASH_COLLECTION_ID, id);
    showTrash(); 
    loadData();
  } catch (err) {
    console.error("فشل استرجاع الملاحظة:", err);
  }
}

let confirmCallback = null;
function openConfirmModal(cb){ confirmCallback=cb; document.getElementById('confirm-modal').style.display='flex'; }
function closeConfirmModal(){ document.getElementById('confirm-modal').style.display='none'; }
function confirmAction(){ closeConfirmModal(); if(confirmCallback) confirmCallback(); }

let deleteForeverIndex = null;
function openDeleteForeverModal(i){ deleteForeverIndex=i; document.getElementById('delete-forever-modal').style.display='flex'; }
function closeDeleteForeverModal(){ document.getElementById('delete-forever-modal').style.display='none'; }

async function deleteForever(){
  const note = trash[deleteForeverIndex];
  if(!note) return;
  try {
    await databases.deleteDocument(DATABASE_ID, TRASH_COLLECTION_ID, note.id);
    closeDeleteForeverModal(); 
    showTrash(); 
    loadData();
  } catch (err) {
    console.error("فشل الحذف النهائي من السحابة:", err);
  }
}

async function togglePin(){
  const note = notes.find(n => n.id === currentNoteId);
  if(!note) return;
  note.pinned = !note.pinned;
  updatePinButton();
  
  try {
    await databases.updateDocument(DATABASE_ID, NOTES_COLLECTION_ID, currentNoteId, { pinned: note.pinned });
  } catch (err) {
    console.error("فشل تعديل التثبيت:", err);
  }

  const msg = note.pinned ? 'تم التثبيت 📌' : 'تم إلغاء التثبيت';
  const temp = document.createElement('div');
  temp.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:10px 20px;border-radius:8px;z-index:9999;';
  temp.textContent = msg;
  document.body.appendChild(temp);
  setTimeout(()=>temp.remove(),1500);
}

function updatePinButton(){
  const btn = document.getElementById('pin-btn');
  const note = notes.find(n => n.id === currentNoteId);
  if(note && note.pinned) {
    btn.style.background = '#e0f2fe';
    btn.style.borderColor = '#3b82f6';
    btn.style.color = '#3b82f6';
  } else {
    btn.style.background = 'white';
    btn.style.borderColor = 'var(--border)';
    btn.style.color = 'var(--text)';
  }
}

function formatText(cmd,val=null){
  const e=document.getElementById('note-content'); e.focus();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand(cmd,false,val);
  setTimeout(saveCurrentNote,300);
}

function toggleHighlight(color){
  const selection = window.getSelection();
  
  // نتحقق أولاً أن المستخدم قام بتحديد نص بالفعل
  if (selection && selection.rangeCount > 0 && selection.toString().length > 0) {
    const range = selection.getRangeAt(0);
    
    // إنشاء عنصر خلفية (mark) وتلوينه باللون المطلوب
    const mark = document.createElement('mark');
    mark.style.backgroundColor = color;
    mark.style.color = 'inherit'; // للحفاظ على لون خط المستخدم (أزرق أو وردي)
    
    try {
      // استخراج النص المحدد ووضعه داخل الـ mark الملون
      mark.appendChild(range.extractContents());
      // إدخال الـ mark الملون في نفس مكان النص القديم بالضبط
      range.insertNode(mark);
    } catch (err) {
      console.error("فشل التلوين المباشر:", err);
    }
    
    // إزالة التحديد بعد التلوين بنجاح
    selection.removeAllRanges();
  }
  
  // تنظيف الهايلايتر وحفظ التغييرات فوراً في قاعدة البيانات
  currentHighlight = null; 
  resetHighlighterButtons();
  setTimeout(saveCurrentNote, 100);
}

function resetHighlighterButtons(){
  document.querySelectorAll('.toolbar button[id^="hl-"]').forEach(btn => btn.classList.remove('active'));
  if(currentHighlight){
    if(currentHighlight==='#86efac') document.getElementById('hl-green').classList.add('active');
    if(currentHighlight==='#fda4af') document.getElementById('hl-red').classList.add('active');
    if(currentHighlight==='#fde047') document.getElementById('hl-yellow').classList.add('active');
  }
}

function applyTheme(t){
  const r=document.documentElement;
  if(t==='light'){r.style.setProperty('--bg','#f4f6f8');r.style.setProperty('--card-bg','#ffffff');r.style.setProperty('--text','#1f2937');r.style.setProperty('--accent','#3b82f6');r.style.setProperty('--border','#e5e7eb');r.style.setProperty('--toolbar-bg','#f8fafc');}
  else if(t==='blue'){r.style.setProperty('--bg','#e0f2fe');r.style.setProperty('--card-bg','#ffffff');r.style.setProperty('--text','#0c4a6e');r.style.setProperty('--accent','#0284c8');r.style.setProperty('--border','#bae6fd');r.style.setProperty('--toolbar-bg','#f0f9ff');}
  else if(t==='dark'){r.style.setProperty('--bg','#0f172a');r.style.setProperty('--card-bg','#1e2937');r.style.setProperty('--text','#e2e8f0');r.style.setProperty('--accent','#60a5fa');r.style.setProperty('--border','#334155');r.style.setProperty('--toolbar-bg','#1e2937');}
  else if(t==='pink'){r.style.setProperty('--bg','#fdf2f8');r.style.setProperty('--card-bg','#ffffff');r.style.setProperty('--text','#831843');r.style.setProperty('--accent','#db2777');r.style.setProperty('--border','#fce7f3');r.style.setProperty('--toolbar-bg','#fdf4ff');}
  localStorage.setItem('theme',t);
}

function updateUserUI(){
  document.getElementById('user-nawaf').classList.toggle('active',currentUser==='nawaf');
  document.getElementById('user-basma').classList.toggle('active',currentUser==='basma');
}

// دالة ذكية لتجهيز لون الخط للمستخدم الحالي فوراً ودون تقطيع للحروف العربية
function applyUserColorDirectly() {
  const editor = document.getElementById('note-content');
  if (document.activeElement !== editor && document.getElementById('editor-screen').style.display === 'block') {
    editor.focus();
  }
  const userColor = currentUser === 'nawaf' ? '#1e40af' : '#db2777'; // أزرق لنواف ووردي لبسمة
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('foreColor', false, userColor);
  
  if (currentHighlight) {
    document.execCommand('backColor', false, currentHighlight);
  } else {
    document.execCommand('backColor', false, 'rgba(0,0,0,0)');
  }
}

function selectUser(user){
  currentUser = user;
  localStorage.setItem('currentUser', user);
  updateUserUI();
  // تحويل لون المؤشر والكتابة فوراً عند الضغط على اسم المستخدم بدون كتابة فراغات
  applyUserColorDirectly();
}

function updateGreetingAndTime(){
  const h = new Date().getHours();
  document.getElementById('greeting-text').textContent = h<12 ? 'صباح الخير ☀️' : (h<18 ? 'مساء الخير 🌤️' : 'مساء الخير 🌙');
  const now=new Date();
  document.getElementById('datetime').innerHTML=`${now.toLocaleDateString('ar-EG',{weekday:'long',month:'long',day:'numeric'})}<br>${now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}`;
}

function init(){
  loadData();
  setupRealtimeListener();
  updateGreetingAndTime();
  setInterval(updateGreetingAndTime,60000);
  updateUserUI();

  const editor = document.getElementById('note-content');

  // ضمان بقاء وتطبيق التلوين فوراً عند الضغط داخل المحرر أو النزول لسطر جديد
  editor.addEventListener('focus', () => { applyUserColorDirectly(); });
  editor.addEventListener('click', () => { applyUserColorDirectly(); });
  
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      // الانتظار الفوري لأجزاء من الثانية حتى ينزل السطر ثم تطبيق لون المستخدم فوراً
      setTimeout(applyUserColorDirectly, 10);
    }
  });

  editor.addEventListener('input', () => {
    clearTimeout(saveTimeout); 
    saveTimeout = setTimeout(saveCurrentNote, 1000);
  });

  document.getElementById('note-title').addEventListener('input',()=>{
    clearTimeout(saveTimeout);
    saveTimeout=setTimeout(saveCurrentNote,600);
  });
  
  document.getElementById('new-note-modal').addEventListener('click',e=>{
    if(e.target.id==='new-note-modal') hideNewNoteModal();
  });
  
  document.getElementById('new-title-input').addEventListener('keypress',e=>{
    if(e.key==='Enter') confirmNewNote();
  });
}

init();
</script>
</body>
</html>
